<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bee05 - 自己紹介</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", sans-serif;
      background: #0f0f23;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: #1a1a2e;
      border: 1px solid #30305a;
      border-radius: 16px;
      padding: 48px;
      max-width: 480px;
      width: 90%;
      text-align: center;
    }

    .avatar {
      width: 96px;
      height: 96px;
      background: linear-gradient(135deg, #f7c948, #ee5a24);
      border-radius: 50%;
      margin: 0 auto 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 40px;
      font-weight: bold;
      color: #1a1a2e;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 8px;
      color: #f0f0f0;
    }

    .subtitle {
      font-size: 14px;
      color: #888;
      margin-bottom: 32px;
    }

    .section {
      text-align: left;
      margin-bottom: 24px;
    }

    .section-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #f7c948;
      margin-bottom: 12px;
    }

    .hobby {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #16213e;
      border: 1px solid #30305a;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">b</div>
    <h1>bee05</h1>
    <p class="subtitle">Self Introduction</p>

    <div class="section">
      <p class="section-title">Hobby</p>
      <div class="hobby">
        <span>&#129302;</span>
        <span>AIツールを試すこと</span>
      </div>
    </div>
  </div>
</body>
</html>
