<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bee05 - 自己紹介</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", sans-serif;
      background: #0f0f23;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: #1a1a2e;
      border: 1px solid #30305a;
      border-radius: 16px;
      padding: 48px;
      max-width: 480px;
      width: 90%;
      text-align: center;
      animation: cardIn 0.6s ease-out;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .avatar {
      width: 96px;
      height: 96px;
      background: linear-gradient(135deg, #f7c948, #ee5a24);
      border-radius: 50%;
      margin: 0 auto 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 40px;
      font-weight: bold;
      color: #1a1a2e;
      animation: pulse 3s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(247, 201, 72, 0.4); }
      50% { box-shadow: 0 0 20px 8px rgba(247, 201, 72, 0.15); }
    }

    h1 {
      font-size: 28px;
      margin-bottom: 8px;
      color: #f0f0f0;
      animation: fadeUp 0.6s ease-out 0.15s both;
    }

    .subtitle {
      font-size: 14px;
      color: #888;
      margin-bottom: 32px;
      animation: fadeUp 0.6s ease-out 0.25s both;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .section {
      text-align: left;
      margin-bottom: 24px;
      animation: fadeUp 0.6s ease-out both;
    }

    .section:nth-child(4) { animation-delay: 0.35s; }
    .section:nth-child(5) { animation-delay: 0.45s; }

    .section-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #f7c948;
      margin-bottom: 12px;
    }

    .hobby {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #16213e;
      border: 1px solid #30305a;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 15px;
      transition: border-color 0.3s, transform 0.3s;
    }

    .hobby:hover {
      border-color: #f7c948;
      transform: translateX(4px);
    }

    .skills-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .skill-tag {
      background: #16213e;
      border: 1px solid #30305a;
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 13px;
      transition: border-color 0.3s, transform 0.3s, background 0.3s;
      opacity: 0;
      animation: popIn 0.4s ease-out forwards;
    }

    .skill-tag:nth-child(1) { animation-delay: 0.5s; }
    .skill-tag:nth-child(2) { animation-delay: 0.6s; }
    .skill-tag:nth-child(3) { animation-delay: 0.7s; }
    .skill-tag:nth-child(4) { animation-delay: 0.8s; }
    .skill-tag:nth-child(5) { animation-delay: 0.9s; }
    .skill-tag:nth-child(6) { animation-delay: 1.0s; }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: scale(0.6);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .skill-tag:hover {
      border-color: #f7c948;
      background: #1e2a4a;
      transform: translateY(-2px);
    }

    .skill-bar {
      margin-bottom: 12px;
    }

    .skill-bar-header {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 6px;
    }

    .skill-bar-label {
      color: #ccc;
    }

    .skill-bar-level {
      color: #888;
    }

    .skill-bar-track {
      height: 6px;
      background: #0f0f23;
      border-radius: 3px;
      overflow: hidden;
    }

    .skill-bar-fill {
      height: 100%;
      border-radius: 3px;
      width: 0;
      animation: fillBar 1s ease-out forwards;
    }

    .skill-bar:nth-child(1) .skill-bar-fill { animation-delay: 0.6s; background: linear-gradient(90deg, #f7c948, #ee5a24); }
    .skill-bar:nth-child(2) .skill-bar-fill { animation-delay: 0.75s; background: linear-gradient(90deg, #48f7c9, #24aaee); }
    .skill-bar:nth-child(3) .skill-bar-fill { animation-delay: 0.9s; background: linear-gradient(90deg, #c948f7, #ee245a); }

    @keyframes fillBar {
      to { width: var(--level); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">b</div>
    <h1>bee05</h1>
    <p class="subtitle">Self Introduction</p>

    <div class="section">
      <p class="section-title">Hobby</p>
      <div class="hobby">
        <span>&#129302;</span>
        <span>AIツールを試すこと</span>
      </div>
    </div>

    <div class="section">
      <p class="section-title">Skills</p>
      <div class="skill-bar">
        <div class="skill-bar-header">
          <span class="skill-bar-label">AI / Prompt Engineering</span>
          <span class="skill-bar-level">Advanced</span>
        </div>
        <div class="skill-bar-track">
          <div class="skill-bar-fill" style="--level: 85%"></div>
        </div>
      </div>
      <div class="skill-bar">
        <div class="skill-bar-header">
          <span class="skill-bar-label">Web Development</span>
          <span class="skill-bar-level">Intermediate</span>
        </div>
        <div class="skill-bar-track">
          <div class="skill-bar-fill" style="--level: 65%"></div>
        </div>
      </div>
      <div class="skill-bar">
        <div class="skill-bar-header">
          <span class="skill-bar-label">Automation</span>
          <span class="skill-bar-level">Intermediate</span>
        </div>
        <div class="skill-bar-track">
          <div class="skill-bar-fill" style="--level: 60%"></div>
        </div>
      </div>
    </div>

    <div class="section">
      <p class="section-title">Tech Stack</p>
      <div class="skills-list">
        <span class="skill-tag">Claude</span>
        <span class="skill-tag">ChatGPT</span>
        <span class="skill-tag">HTML / CSS</span>
        <span class="skill-tag">JavaScript</span>
        <span class="skill-tag">Python</span>
        <span class="skill-tag">Git</span>
      </div>
    </div>
  </div>
</body>
</html>
